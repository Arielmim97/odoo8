[options]
; Custom modules live in ./addons (mounted at /mnt/extra-addons).
; The second path is the addons shipped inside the odoo:8.0 image.
addons_path = /mnt/extra-addons,/usr/lib/python2.7/dist-packages/openerp/addons
data_dir = /etc/odoo
; Master password of the database manager. Change this.
admin_passwd = admin
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
db_template = template1
list_db = True
logfile = /etc/odoo/odoo-server.log
log_level = info
; Odoo 8 equivalent of dev_mode = reload
auto_reload = True
xmlrpc = True
xmlrpc_port = 8069
xmlrpcs_port = 8071
longpolling_port = 8072
; workers = 0 keeps the DB manager and XML-RPC on 8069.
; Set workers > 0 to use the live chat port (8072 inside the container).
workers = 0
max_cron_threads = 1
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 60
limit_time_real = 120
