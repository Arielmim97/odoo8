services:
  db:
    image: postgres:9.6
    user: root
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_DB=postgres
    restart: always             # run as a service
    volumes:
      - ./postgresql:/var/lib/postgresql/data

  odoo8:
    image: odoo:8.0
    # odoo:8.0 (2017) only publishes linux/amd64. Apple Silicon needs emulation.
    # The image aborts with "Running as user 'root' is a security risk".
    platform: linux/amd64
    user: odoo
    depends_on:
      - db
    ports:
      - "10008:8069"
      - "20008:8072" # live chat (only listens when workers > 0)
    tty: true
    command: --
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    volumes:
      - ./entrypoint.sh:/entrypoint.sh
      - ./addons:/mnt/extra-addons
      - ./etc:/etc/odoo
    restart: always             # run as a service
